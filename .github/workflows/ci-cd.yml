name: CI/CD Pipeline

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            # 1. Checkout del código
            - name: Checkout code
              uses: actions/checkout@v4

            # 2. Instalar Go
            - name: Setup Go
              uses: actions/setup-go@v4
              with:
                  go-version: "1.27.1"

            # 3. Instalar dependencias
            - name: Install dependencies
              run: go mod tidy

            # 4. Ejecutar tests
            - name: Run Unit Tests
              run: go test -v -cover

            # 5. Test Coverage
            - name: Generate Coverage Report
              run: |
                  go test -coverprofile=coverage.out
                  go tool cover -func=coverage.out

            # 6. Setup Docker Buildx
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # 7. Login a GitHub Container Registry
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.TOKEN }}

            # 8. Docker Build y Push
            - name: Build and Push Docker Image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: |
                      ghcr.io/lu2ky/websocket-for-chat:${{ github.run_number }}
                      ghcr.io/lu2ky/websocket-for-chat:latest
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}

                      Repository: ${{ github.repository }}
                      Branch: ${{ github.ref_name }}
                      Commit: ${{ github.sha }}
                      Run Number: ${{ github.run_number }}

                      Revisa los logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
